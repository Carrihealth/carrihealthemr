# fly.toml app configuration file generated for carrihealthemr on 2026-06-12T08:25:49Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'carrihealthemr'
primary_region = 'lhr'

[build]

[env]
  NODE_ENV = 'production'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
